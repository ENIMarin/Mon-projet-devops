name: CI/CD Pipeline - Backend

# 1. Le déclencheur : Le robot s'active à chaque fois qu'on pousse du code sur "main"
on:
  push:
    branches:
      - main

jobs:
  # ==========================================
  # ÉTAPE 1 : CONSTRUCTION DE L'IMAGE DOCKER
  # ==========================================
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupération du code source
        uses: actions/checkout@v4

      - name: 🔑 Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🔨 Build & Push vers Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: ./backend      # Le dossier où se trouve ton Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mon-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/mon-backend:${{ github.sha }}

  # ==========================================
  # ÉTAPE 2 : DÉPLOIEMENT SUR KUBERNETES (AKS)
  # ==========================================
  deploy-to-aks:
    needs: build-and-push # On attend que l'image soit créée avant de déployer
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupération du code source
        uses: actions/checkout@v4

      - name: ⚙️ Configuration de l'accès Kubernetes
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: 🚀 Déploiement et Rolling Update
        run: |
          # 1. On applique le fichier YAML classique
          kubectl apply -f k8s/backend.yaml
          
          # 2. On met à jour l'image avec la nouvelle version qu'on vient de compiler
          kubectl set image deployment/backend-deployment backend=${{ secrets.DOCKER_USERNAME }}/mon-backend:${{ github.sha }}