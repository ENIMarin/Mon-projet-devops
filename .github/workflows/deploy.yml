name: CI/CD Pipeline - Fullstack

on:
  push:
    branches:
      - main

jobs:
  # ==========================================
  # 🔵 TRACK BACKEND (Se lance immédiatement)
  # ==========================================
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Code source
        uses: actions/checkout@v4
      - name: 🔑 Connexion Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: 🔨 Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mon-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/mon-backend:${{ github.sha }}

  deploy-backend:
    needs: build-backend # Attend que l'image backend soit prête
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: 🚀 Déploiement Backend
        run: |
          kubectl apply -f k8s/backend.yaml
          kubectl set image deployment/backend-deployment backend=${{ secrets.DOCKER_USERNAME }}/mon-backend:${{ github.sha }}

  # ==========================================
  # 🟢 TRACK FRONTEND (Se lance immédiatement)
  # ==========================================
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Code source
        uses: actions/checkout@v4
      - name: 🔑 Connexion Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: 🔨 Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend      # <-- Assure-toi que ton dossier s'appelle bien "frontend"
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mon-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/mon-frontend:${{ github.sha }}

  deploy-frontend:
    needs: build-frontend # Attend que l'image frontend soit prête
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: 🚀 Déploiement Frontend
        run: |
          kubectl apply -f k8s/frontend.yaml
          # Attention aux noms ici : vérifie que ça correspond bien à ton fichier frontend.yaml !
          kubectl set image deployment/frontend-deployment frontend=${{ secrets.DOCKER_USERNAME }}/mon-frontend:${{ github.sha }}