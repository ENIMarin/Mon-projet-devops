name: CI/CD Pipeline - Fullstack avec Tests

on:
  push:
    branches:
      - main

jobs:
  # ==========================================
  # 🔵 TRACK BACKEND
  # ==========================================
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Code source
        uses: actions/checkout@v4

      # --- 🧪 ÉTAPE DE TESTS BACKEND ---
      - name: ⚙️ Préparer Node.js pour les tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🧪 Installer et tester le Backend
        run: |
          cd backend
          npm install
          npm test
      # ---------------------------------

      - name: 🔑 Connexion Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🔨 Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mon-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/mon-backend:${{ github.sha }}

  deploy-backend:
    needs: build-backend # On déploie uniquement si la construction ET LES TESTS ont réussi !
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: 🚀 Déploiement Backend
        run: |
          kubectl apply -f k8s/backend.yaml
          kubectl set image deployment/backend-deployment backend=${{ secrets.DOCKER_USERNAME }}/mon-backend:${{ github.sha }}


  # ==========================================
  # 🟢 TRACK FRONTEND
  # ==========================================
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Code source
        uses: actions/checkout@v4

      # --- 🧪 ÉTAPE DE TESTS FRONTEND ---
      - name: ⚙️ Préparer Node.js pour les tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🧪 Installer et tester le Frontend
        run: |
          cd frontend
          npm install
          npm test
      # ----------------------------------

      - name: 🔑 Connexion Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🔨 Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mon-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/mon-frontend:${{ github.sha }}

  deploy-frontend:
    needs: build-frontend # On déploie uniquement si la construction ET LES TESTS ont réussi !
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: 🚀 Déploiement Frontend
        run: |
          kubectl apply -f k8s/frontend.yaml
          kubectl set image deployment/frontend-deployment frontend=${{ secrets.DOCKER_USERNAME }}/mon-frontend:${{ github.sha }}