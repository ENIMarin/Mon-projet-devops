services:
  backend:
    build: ./backend
    container_name: backend-prod
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    restart: always

  frontend:
    build: ./frontend
    container_name: frontend-prod
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: always