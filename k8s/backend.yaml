apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 2
  strategy:
    type: RollingUpdate # Paramétrage précis du rolling Update (Même si rolling update déjà présent avec le Déployment)
    rollingUpdate:
      maxSurge: 1       
      maxUnavailable: 0 
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/enimarin/mon-projet-devops-backend:latest
          env:
            - name: DB_HOST
              value: "mysql-service"
            - name: DB_USER
              value: "root"
            - name: DB_PASSWORD
              value: "root"
            - name: DB_NAME
              value: "mon_projet_db"
            - name: DB_DIALECT
              value: "mysql"
          ports:
            - containerPort: 3000
---

apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: LoadBalancer
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000